<!DOCTYPE html>
<html lang="es" class="h-full bg-[#121316]">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUMIX - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body
    class="h-full flex items-center justify-center p-4 text-gray-200 antialiased selection:bg-orange-500 selection:text-white">

    <div class="max-w-md w-full bg-[#1a1b1e] border border-gray-800 rounded-3xl p-8 shadow-2xl">
        <div class="flex flex-col items-center mb-8">
            <div
                class="w-16 h-16 bg-orange-600 rounded-2xl flex items-center justify-center shadow-lg shadow-orange-600/30 mb-4">
                <span class="font-extrabold text-2xl text-white tracking-wider">SX</span>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">SUMIX</h1>
            <p class="text-sm text-gray-400 mt-1">Sistema de Control Comercial</p>
        </div>

        {% if error %}
        <div class="mb-6 p-3 bg-red-500/10 border border-red-500/20 text-red-400 text-sm rounded-xl text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Usuario</label>
                <input type="text" name="username" required
                    class="w-full bg-[#121316] border border-gray-700 rounded-xl px-4 py-3 text-white focus:border-orange-500 focus:outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Contraseña</label>
                <input type="password" name="password" required
                    class="w-full bg-[#121316] border border-gray-700 rounded-xl px-4 py-3 text-white focus:border-orange-500 focus:outline-none transition">
            </div>

            <button type="submit"
                class="w-full py-3.5 bg-orange-600 hover:bg-orange-500 text-white font-bold rounded-xl transition shadow-lg shadow-orange-600/30 active:scale-95">
                Entrar al Sistema
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-500">
            Acceso autorizado exclusivo para personal de SUMIX.
        </div>
    </div>

</body>

</html>
